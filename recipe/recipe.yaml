schema_version: 1

context:
  name: sphericart
  version: "2.0.4"
  build_number: 0

recipe:
  name: ${{ name|lower }}-split
  version: ${{ version }}

source:
  - url: https://github.com/lab-cosmo/sphericart/archive/v${{ version }}.tar.gz
    sha256: 2eeaf6b2684e2059a77ef3226028c5363534d8c3d4fb9629efb954a528d49533
    patches:
      - respect-cmake-args.patch

build:
  # Secondary Linux arches are enabled for CPU builds first.
  number: ${{ build_number }}
  skip:
    - cuda_compiler_version == "11.8"
    - cuda_compiler_version != "None" and (ppc64le or aarch64 or win)

outputs:
  - package:
      name: sphericart
    build:
      script:
        file: ${{ "build.bat" if win else "build.sh" }}
    requirements:
      build:
        - ${{ compiler("c") }}
        - ${{ compiler("cxx") }}
        - ${{ stdlib("c") }}
        - cmake >=3.27
        - if: build_platform != target_platform
          then:
            - cross-python_${{ target_platform }}
            - pip
            - pybind11
            - python
            - setuptools
        - if: linux
          then: libgomp
        - if: osx
          then: llvm-openmp
        - if: unix
          then: make
        - ninja
      host:
        - if: linux
          then: libgomp
        - if: osx
          then: llvm-openmp
        - pip
        - python
        - setuptools >=44
        - wheel >=0.36
        - if: win
          then: vcomp14
      run:
        - numpy
        - python
        - if: win
          then: vcomp14
    tests:
      - python:
          imports:
            - sphericart
          pip_check: true
      - files:
          recipe:
            - run_test.py
        requirements:
          run:
            - pip
        script:
          - python run_test.py

  - package:
      name: sphericart-torch
    build:
      # Cross-building PyTorch extensions links against build-platform
      # libtorch, so keep the torch output on native platforms only.
      # Current PyTorch pins make the torch output non-final on osx-arm64.
      # Keep the base sphericart output enabled there.
      # PyTorch does not provide Python 3.14 builds yet. Keep the base
      # sphericart output enabled for py314 and skip only the torch output.
      skip:
        - ppc64le or aarch64
        - osx and arm64
        - win
        - match(python, ">=3.14")
      script:
        file: build_torch.sh
    requirements:
      build:
        - ${{ compiler("c") }}
        - ${{ compiler("cxx") }}
        - ${{ stdlib("c") }}
        - cmake >=3.30
        - if: build_platform != target_platform
          then:
            - cross-python_${{ target_platform }}
            - pip
            - pybind11
            - python
            - setuptools
            - if: cuda_compiler_version == "None"
              then: pytorch * cpu*
              else: pytorch * cuda*
        - if: linux
          then:
            - libgomp
            - llvm-openmp
        - if: osx
          then: llvm-openmp
        - if: unix
          then: make
        - ninja
        - if: cuda_compiler_version != "None"
          then:
            - ${{ compiler("cuda") }}
      host:
        - if: linux
          then:
            - libgomp
            - llvm-openmp
        - if: osx
          then: llvm-openmp
        - pip
        - python
        - if: cuda_compiler_version == "None"
          then: pytorch * cpu*
          else: pytorch * cuda*
        - setuptools >=77
        - if: cuda_compiler_version != "None"
          then:
            - cuda-version ==${{ cuda_compiler_version }}
            - nvtx-c
      run:
        - ${{ pin_subpackage("sphericart", exact=True) }}
        - numpy
        - python
        - if: linux
          then: llvm-openmp
        - if: cuda_compiler_version == "None"
          then: pytorch * cpu*
          else: pytorch * cuda*
    tests:
      - python:
          imports:
            - sphericart.torch
          pip_check: true
      - files:
          recipe:
            - run_test_torch.py
        requirements:
          run:
            - pip
        script:
          - python run_test_torch.py

about:
  homepage: https://github.com/lab-cosmo/sphericart
  summary: Multi-language library for the calculation of spherical harmonics in Cartesian coordinates
  license: Apache-2.0 OR MIT
  license_file:
    - LICENSE-APACHE
    - LICENSE-MIT

extra:
  feedstock-name: sphericart
  recipe-maintainers:
    - jeongseok-meta
